<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vato</title>
<link rel="stylesheet" href="/static/face.css">
</head>
<body class="state-idle">
  <div id="listen-ring"></div>
  <div id="particles"></div>

  <!-- frost creeps in from the screen edges when below freezing (spec §9) -->
  <svg id="frost" viewBox="0 0 100 12" preserveAspectRatio="none">
    <path d="M0,0 H100 V3 L96,9 L93,4 L89,11 L85,5 L81,8 L77,3 L72,10 L68,4
             L63,7 L59,3 L54,12 L50,5 L46,8 L41,3 L36,10 L32,5 L28,7 L23,3
             L19,11 L15,4 L11,8 L7,3 L3,9 L0,4 Z" fill="#cfeefc" opacity=".92"/>
  </svg>

  <div id="card">
    <!-- ─── FRONT: the face ─── -->
    <div id="front">
      <div id="face">
        <!-- headwear (one shows at a time) -->
        <svg class="acc" id="party-hat" viewBox="0 0 100 90">
          <polygon points="50,2 20,82 80,82" fill="#ffd23f" stroke="#14161c" stroke-width="3"/>
          <polygon points="50,2 32,50 50,42 68,50" fill="#ff5d8f"/>
          <circle cx="50" cy="6" r="7" fill="#4ecdc4" stroke="#14161c" stroke-width="3"/>
        </svg>
        <svg class="acc" id="knit-hat" viewBox="0 0 120 80">
          <path d="M10,70 Q10,14 60,14 Q110,14 110,70 Z" fill="#d64550" stroke="#14161c" stroke-width="4"/>
          <rect x="6" y="62" width="108" height="16" rx="8" fill="#f2f2f2" stroke="#14161c" stroke-width="4"/>
          <circle cx="60" cy="12" r="9" fill="#f2f2f2" stroke="#14161c" stroke-width="4"/>
        </svg>
        <svg class="acc" id="nightcap" viewBox="0 0 130 80">
          <path d="M14,70 Q20,12 70,12 Q118,16 122,30 L106,38 Q96,24 70,24 Q34,26 30,70 Z"
                fill="#3f5fbf" stroke="#14161c" stroke-width="4"/>
          <rect x="8" y="62" width="100" height="14" rx="7" fill="#f2f2f2" stroke="#14161c" stroke-width="4"/>
          <circle cx="120" cy="34" r="9" fill="#f2f2f2" stroke="#14161c" stroke-width="4"/>
        </svg>
        <svg class="acc" id="umbrella" viewBox="0 0 120 100">
          <path d="M10,46 Q60,-14 110,46 Q97,36 85,46 Q72,34 60,46 Q48,34 35,46 Q23,36 10,46 Z"
                fill="#4ecdc4" stroke="#14161c" stroke-width="4"/>
          <line x1="60" y1="44" x2="60" y2="88" stroke="#14161c" stroke-width="5"/>
          <path d="M60,88 Q60,98 50,96" fill="none" stroke="#14161c" stroke-width="5" stroke-linecap="round"/>
        </svg>

        <div class="eyes">
          <div class="eye eye-left"><div class="shine"></div><div class="heart"></div></div>
          <div class="eye eye-right"><div class="shine"></div><div class="heart"></div></div>
          <!-- sunglasses sit across the eye row -->
          <svg class="acc" id="sunglasses" viewBox="0 0 300 80">
            <rect x="18" y="14" width="110" height="56" rx="26" fill="#14161c"/>
            <rect x="172" y="14" width="110" height="56" rx="26" fill="#14161c"/>
            <rect x="124" y="26" width="52" height="12" fill="#14161c"/>
            <rect x="0" y="22" width="24" height="12" fill="#14161c"/>
            <rect x="276" y="22" width="24" height="12" fill="#14161c"/>
            <circle cx="52" cy="32" r="9" fill="#ffffff" opacity=".5"/>
            <circle cx="206" cy="32" r="9" fill="#ffffff" opacity=".5"/>
          </svg>
        </div>

        <div class="cheeks">
          <div class="cheek cheek-left"></div>
          <div class="cheek cheek-right"></div>
        </div>

        <svg class="acc" id="mustache" viewBox="0 0 200 50">
          <path d="M100,22 Q80,2 55,8 Q22,16 8,4 Q10,34 42,40 Q78,46 100,24
                   Q122,46 158,40 Q190,34 192,4 Q178,16 145,8 Q120,2 100,22 Z"
                fill="#14161c"/>
        </svg>

        <div class="mouth">
          <div class="mouth-inner">
            <div class="teeth"></div>
            <div class="inner-tongue"></div>
          </div>
          <div class="tongue"></div>
        </div>
        <div id="zzz">z z z</div>
      </div>
    </div>

    <!-- ─── BACK: the engine room (spec §9 back panel) ─── -->
    <div id="back">
      <div id="gears">
        <svg class="gear gear-big" viewBox="0 0 100 100">
          <g fill="#3a4254">
            <circle cx="50" cy="50" r="30"/>
            <rect id="tb" x="44" y="4" width="12" height="20" rx="3"/>
            <use href="#tb" transform="rotate(45 50 50)"/>
            <use href="#tb" transform="rotate(90 50 50)"/>
            <use href="#tb" transform="rotate(135 50 50)"/>
            <use href="#tb" transform="rotate(180 50 50)"/>
            <use href="#tb" transform="rotate(225 50 50)"/>
            <use href="#tb" transform="rotate(270 50 50)"/>
            <use href="#tb" transform="rotate(315 50 50)"/>
          </g>
          <circle cx="50" cy="50" r="11" fill="#1b1e27"/>
        </svg>
        <svg class="gear gear-small" viewBox="0 0 100 100">
          <g fill="#4a5468">
            <circle cx="50" cy="50" r="30"/>
            <rect id="ts" x="44" y="4" width="12" height="20" rx="3"/>
            <use href="#ts" transform="rotate(60 50 50)"/>
            <use href="#ts" transform="rotate(120 50 50)"/>
            <use href="#ts" transform="rotate(180 50 50)"/>
            <use href="#ts" transform="rotate(240 50 50)"/>
            <use href="#ts" transform="rotate(300 50 50)"/>
          </g>
          <circle cx="50" cy="50" r="11" fill="#1b1e27"/>
        </svg>
      </div>
      <div id="leds">
        <span class="led"></span><span class="led"></span><span class="led"></span>
        <span class="led"></span><span class="led"></span><span class="led"></span>
        <span class="led"></span><span class="led"></span>
      </div>
      <div id="back-label">VATO &middot; ENGINE ROOM</div>
      <div id="ticker"></div>
    </div>
  </div>

  <script src="/static/face.js"></script>
</body>
</html>
